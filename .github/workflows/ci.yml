name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test
        run: node --test   # no dependencies; the tests import only the demo modules

  figures:
    # A committed SVG can drift silently from the generator that claims to produce
    # it: a code change that is never regenerated, or a hand-edited artifact, passes
    # every syntax and link check. Regenerate and fail on any diff, so the figures on
    # the page are always the ones this generator actually produces.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Regenerate diagrams
        run: python3 docs/diagrams/generate_diagrams.py   # stdlib only; no dependencies
      - name: Fail if the committed SVGs are not what the generator produces
        run: git diff --exit-code -- 'docs/diagrams/*.svg'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
