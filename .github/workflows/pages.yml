# Deploy the static site in docs/ via GitHub Actions (Pages source = "GitHub
# Actions"), NOT "deploy from a branch". The branch source runs a GitHub-injected
# workflow that uses actions/upload-artifact@v4 (Node 20); authoring the deploy
# ourselves lets us pin the current Node 24 Pages actions.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    permissions:
      contents: read
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # authenticate the deployment to the Pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
