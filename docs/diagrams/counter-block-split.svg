<svg xmlns="http://www.w3.org/2000/svg" width="900" height="394" viewBox="0 0 900 394" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7f9aa6}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.fneu{fill:var(--neuf)}.sneu{stroke:var(--neus)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="392" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">The counter block is a capacity budget</tspan></text><text x="450.0" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">what the nonce buys, what the counter buys, and why the demo helper splits it differently</tspan></text><text x="450.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">128 bits, allocated once. Bits given to the nonce are taken from the counter.</tspan></text><text x="60" y="94" font-family="Arial, Helvetica, sans-serif" font-size="12" class="ink" text-anchor="start" font-weight="700"><tspan x="60" dy="0">The page's sample uses a random 96-bit nonce and a 32-bit counter</tspan></text><rect class="fneu" stroke="#006da0" x="60" y="104" width="585.0" height="44" rx="9" stroke-width="1.5"/><text x="352.5" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="352.5" dy="0">Nonce — 96 bits</tspan></text><rect class="fneu" stroke="#006da0" x="645.0" y="104" width="195.0" height="44" rx="9" stroke-width="1.5"/><text x="742.5" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="742.5" dy="0">Counter — 32 bits</tspan></text><text x="352.5" y="166" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="352.5" dy="0">96 random bits keep the chance of a repeat</tspan><tspan x="352.5" dy="13">below 2⁻³² out to about 2³² messages</tspan></text><text x="742.5" y="166" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="742.5" dy="0">2³² blocks from zero = 64 GiB in one message</tspan><tspan x="742.5" dy="13">(RFC 3686 starts at 1, so 2³²−1 = 68,719,476,720 octets)</tspan></text><text x="60" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" class="ink" text-anchor="start" font-weight="700"><tspan x="60" dy="0">This browser proof of concept uses a deliberately different split</tspan></text><rect class="fneu" stroke="#64748b" x="60" y="238" width="390.0" height="44" rx="9" stroke-width="1.5"/><text x="255.0" y="264.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="255.0" dy="0">Nonce — 64 bits</tspan></text><rect class="fneu" stroke="#64748b" x="450.0" y="238" width="390.0" height="44" rx="9" stroke-width="1.5"/><text x="645.0" y="264.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="645.0" dy="0">Counter — 64 bits</tspan></text><text x="255.0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="255.0" dy="0">64 bits is too narrow for random nonces</tspan><tspan x="255.0" dy="13">at scale; every demo run takes a fresh key</tspan></text><text x="645.0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="645.0" dy="0">Far more counter than any demo needs;</tspan><tspan x="645.0" dy="13">the width is not the point being taught</tspan></text><text x="450.0" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11" class="ink" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">Neither split adds integrity. The budget governs how much one key may encrypt before a counter block repeats — a tag is still required on top.</tspan></text><text x="450.0" y="378" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational allocation. RFC 3686 uses the same 96/32 widths but builds the prefix from a 32-bit nonce and 64-bit IV.</tspan></text></svg>
