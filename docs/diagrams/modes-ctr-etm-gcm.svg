<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7f9aa6}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.fneu{fill:var(--neuf)}.sneu{stroke:var(--neus)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="454" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">AES-CTR, AES-CTR + HMAC, and AES-GCM</tspan></text><text x="450.0" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">all three encrypt with the same counter-mode keystream — only the authentication differs</tspan></text><text x="450.0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="13" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">The reader's three options, on one axis: where does the authentication tag come from?</tspan></text><rect class="panel" x="24" y="100" width="852" height="100" rx="10" stroke-width="1.5"/><rect x="44" y="116" width="180" height="28" rx="14" fill="#006da0"/><text x="134" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="134" dy="0">AES-CTR alone</tspan></text><text x="44" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="muted" text-anchor="start" font-weight="400"><tspan x="44" dy="0">Encrypts (Nonce ‖ counter) to produce keystream S.</tspan><tspan x="44" dy="15">Ciphertext is C = P ⊕ S. No padding needed.</tspan><tspan x="44" dy="15">Nothing authenticates C, so tampering decrypts cleanly.</tspan></text><rect class="fneu" stroke="#b42318" x="612" y="116" width="220" height="52" rx="9" stroke-width="1.5"/><text x="722.0" y="131.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="722.0" dy="0">Malleable: C[i] ⊕ Δ decrypts to</tspan><tspan x="722.0" dy="14">P[i] ⊕ Δ — no error spread</tspan><tspan x="722.0" dy="14">Reused nonce ⇒ C₁ ⊕ C₂ = P₁ ⊕ P₂</tspan></text><text x="722.0" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b42318" text-anchor="middle" font-weight="700"><tspan x="722.0" dy="0">⚠ Confidentiality only — needs a MAC</tspan></text><rect class="panel" x="24" y="212" width="852" height="100" rx="10" stroke-width="1.5"/><rect x="44" y="228" width="180" height="28" rx="14" fill="#006da0"/><text x="134" y="246" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="134" dy="0">AES-CTR + HMAC</tspan></text><text x="44" y="276" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="muted" text-anchor="start" font-weight="400"><tspan x="44" dy="0">The same keystream encryption, then HMAC-SHA256 over</tspan><tspan x="44" dy="15">(counter ‖ ciphertext) under a second, independent key.</tspan><tspan x="44" dy="15">Verify the tag first; decrypt only if it passes.</tspan></text><rect class="fneu" stroke="#087c83" x="612" y="228" width="220" height="52" rx="9" stroke-width="1.5"/><text x="722.0" y="250.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="722.0" dy="0">Tamper and truncation rejected</tspan><tspan x="722.0" dy="14">before any plaintext is returned</tspan></text><text x="722.0" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#087c83" text-anchor="middle" font-weight="700"><tspan x="722.0" dy="0">✔ Authenticated — you compose it</tspan></text><rect class="panel" x="24" y="324" width="852" height="100" rx="10" stroke-width="1.5"/><rect x="44" y="340" width="180" height="28" rx="14" fill="#006da0"/><text x="134" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="134" dy="0">AES-GCM</tspan></text><text x="44" y="388" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="muted" text-anchor="start" font-weight="400"><tspan x="44" dy="0">The same counter-mode keystream, plus a GHASH tag over</tspan><tspan x="44" dy="15">ciphertext and associated data, as a single primitive.</tspan><tspan x="44" dy="15">Security holds only while nonces never repeat.</tspan></text><rect class="fneu" stroke="#087c83" x="612" y="340" width="220" height="52" rx="9" stroke-width="1.5"/><text x="722.0" y="362.8333333333333" font-family="Arial, Helvetica, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="722.0" dy="0">1-bit tamper rejects ciphertext</tspan><tspan x="722.0" dy="14">before decryption completes</tspan></text><text x="722.0" y="408" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#087c83" text-anchor="middle" font-weight="700"><tspan x="722.0" dy="0">✔ Authenticated — built in</tspan></text><text x="450.0" y="440" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational comparison of counter-mode options. GCM nonce limits per NIST SP 800-38D §8; Encrypt-then-MAC ordering per Bellare &amp; Namprempre.</tspan></text></svg>
