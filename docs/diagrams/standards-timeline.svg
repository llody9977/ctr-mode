<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7f9aa6}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.fneu{fill:var(--neuf)}.sneu{stroke:var(--neus)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="388" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">How counter mode came through the move to authenticated encryption</tspan></text><text x="450.0" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">approval, adoption inside AEAD, the AEAD-only cut, and the condition NIST named for retiring the mode</tspan></text><line x1="60" y1="176" x2="840" y2="176" class="arw" stroke-width="2" marker-end="url(#arw)"/><circle cx="105.0" cy="176" r="5" fill="#006da0"/><line x1="105.0" y1="176" x2="105.0" y2="150" stroke="#006da0" stroke-width="1.5"/><rect class="fneu" stroke="#006da0" x="21.0" y="88" width="168" height="62" rx="9" stroke-width="1.5"/><text x="105.0" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="105.0" dy="0">CTR approved, one of</tspan><tspan x="105.0" dy="13">five confidentiality modes</tspan></text><text x="105.0" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#006da0" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0">Dec 2001  ·  SP 800-38A</tspan></text><circle cx="220.0" cy="176" r="5" fill="#006da0"/><line x1="220.0" y1="176" x2="220.0" y2="202" stroke="#006da0" stroke-width="1.5"/><rect class="fneu" stroke="#006da0" x="136.0" y="202" width="168" height="62" rx="9" stroke-width="1.5"/><text x="220.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="220.0" dy="0">AES-CTR in IPsec ESP;</tspan><tspan x="220.0" dy="13">32-bit block counter</tspan></text><text x="220.0" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#006da0" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0">Jan 2004  ·  RFC 3686</tspan></text><circle cx="335.0" cy="176" r="5" fill="#006da0"/><line x1="335.0" y1="176" x2="335.0" y2="150" stroke="#006da0" stroke-width="1.5"/><rect class="fneu" stroke="#006da0" x="251.0" y="88" width="168" height="62" rx="9" stroke-width="1.5"/><text x="335.0" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="335.0" dy="0">GCM = counter mode</tspan><tspan x="335.0" dy="13">+ GHASH tag</tspan></text><text x="335.0" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#006da0" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0">Nov 2007  ·  SP 800-38D</tspan></text><circle cx="450.0" cy="176" r="5" fill="#087c83"/><line x1="450.0" y1="176" x2="450.0" y2="202" stroke="#087c83" stroke-width="1.5"/><rect class="fneu" stroke="#087c83" x="366.0" y="202" width="168" height="62" rx="9" stroke-width="1.5"/><text x="450.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">AEAD only — and all five</tspan><tspan x="450.0" dy="13">suites are counter mode</tspan></text><text x="450.0" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#087c83" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Aug 2018  ·  TLS 1.3</tspan></text><circle cx="565.0" cy="176" r="5" fill="#9a5b00"/><line x1="565.0" y1="176" x2="565.0" y2="150" stroke="#9a5b00" stroke-width="1.5"/><rect class="fneu" stroke="#9a5b00" x="481.0" y="88" width="168" height="62" rx="9" stroke-width="1.5"/><text x="565.0" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="565.0" dy="0">SP 800-38A to gain</tspan><tspan x="565.0" dy="13">authentication guidance</tspan></text><text x="565.0" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a5b00" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0">Apr 2023  ·  Revision decided</tspan></text><circle cx="680.0" cy="176" r="5" fill="#9a5b00"/><line x1="680.0" y1="176" x2="680.0" y2="202" stroke="#9a5b00" stroke-width="1.5"/><rect class="fneu" stroke="#9a5b00" x="596.0" y="202" width="168" height="62" rx="9" stroke-width="1.5"/><text x="680.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="680.0" dy="0">“not yet deprecating” —</tspan><tspan x="680.0" dy="13">no alternative standardised</tspan></text><text x="680.0" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a5b00" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0">Sep 2024  ·  IR 8459</tspan></text><circle cx="795.0" cy="176" r="5" fill="#64748b"/><line x1="795.0" y1="176" x2="795.0" y2="150" stroke="#64748b" stroke-width="1.5"/><rect class="fneu" stroke="#64748b" x="711.0" y="88" width="168" height="62" rx="9" stroke-width="1.5"/><text x="795.0" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="795.0" dy="0">SP 800-197 series: the</tspan><tspan x="795.0" dy="13">named condition to retire</tspan></text><text x="795.0" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0">2025 →  ·  Accordions</tspan></text><text x="450.0" y="352" font-family="Arial, Helvetica, sans-serif" font-size="11" class="ink" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">Counter mode was never removed — what was removed is using it without a tag. Every step right of 2018 keeps the keystream and adds authentication.</tspan></text><text x="450.0" y="374" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational summary of published NIST and IETF status as of September 2026; dates from each publication or its CSRC listing. Not legal or compliance advice.</tspan></text></svg>
