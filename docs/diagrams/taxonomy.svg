<svg xmlns="http://www.w3.org/2000/svg" width="900" height="402" viewBox="0 0 900 402" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7f9aa6}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.fneu{fill:var(--neuf)}.sneu{stroke:var(--neus)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="400" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Three Root Causes and Four Attack Vectors</tspan></text><text x="450.0" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">every CTR mode vulnerability traces back to malleability, keystream determinism, or missing authentication</tspan></text><rect fill="#006da0" stroke="#0d1b2a" x="370.0" y="62" width="160" height="44" rx="9" stroke-width="1.5"/><text x="450.0" y="89.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">AES-CTR Mode</tspan></text><rect fill="#006da0" stroke="#0d1b2a" x="40" y="146" width="260" height="68" rx="9" stroke-width="1.5"/><text x="170.0" y="169.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="170.0" dy="0">Root cause 1 — Malleability</tspan><tspan x="170.0" dy="14">Bitwise XOR has zero error spread:</tspan><tspan x="170.0" dy="14">C ⊕ Δ decrypts to P ⊕ Δ</tspan></text><rect fill="#006da0" stroke="#0d1b2a" x="320" y="146" width="260" height="68" rx="9" stroke-width="1.5"/><text x="450.0" y="169.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="450.0" dy="0">Root cause 2 — Determinism</tspan><tspan x="450.0" dy="14">Same (Key, Nonce) yields same S:</tspan><tspan x="450.0" dy="14">C₁ ⊕ C₂ = P₁ ⊕ P₂ (Two-Time Pad)</tspan></text><rect fill="#006da0" stroke="#0d1b2a" x="600" y="146" width="260" height="68" rx="9" stroke-width="1.5"/><text x="730.0" y="169.83333333333334" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="730.0" dy="0">Root cause 3 — No Integrity</tspan><tspan x="730.0" dy="14">No cryptographic MAC or tag;</tspan><tspan x="730.0" dy="14">modifications go undetected</tspan></text><line x1="450.0" y1="106" x2="170.0" y2="144" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="106" x2="450.0" y2="144" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="106" x2="730.0" y2="144" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect class="fneu sneu" x="30" y="274" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="30" y="274" width="6" height="68" rx="3" fill="#b42318"/><text x="127.5" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="127.5" dy="0">Vector 1</tspan></text><text x="127.5" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" class="ink" text-anchor="middle" font-weight="400"><tspan x="127.5" dy="0">Precision Bit-Flipping</tspan></text><text x="127.5" y="330" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="127.5" dy="0">active malleability</tspan></text><rect class="fneu sneu" x="245" y="274" width="195" height="68" rx="9" stroke-width="1.5"/><rect x="245" y="274" width="6" height="68" rx="3" fill="#006da0"/><text x="342.5" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="342.5" dy="0">Vector 2</tspan></text><text x="342.5" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" class="ink" text-anchor="middle" font-weight="400"><tspan x="342.5" dy="0">Keystream Reuse &amp; Crib-Dragging</tspan></text><text x="342.5" y="330" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="342.5" dy="0">two-time pad</tspan></text><rect class="fneu sneu" x="460" y="274" width="200" height="68" rx="9" stroke-width="1.5"/><rect x="460" y="274" width="6" height="68" rx="3" fill="#6d28d9"/><text x="560.0" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0">Vector 3</tspan></text><text x="560.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" class="ink" text-anchor="middle" font-weight="400"><tspan x="560.0" dy="0">Random-Access Edit Oracle</tspan></text><text x="560.0" y="330" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="560.0" dy="0">chosen-ciphertext</tspan></text><rect class="fneu sneu" x="680" y="274" width="190" height="68" rx="9" stroke-width="1.5"/><rect x="680" y="274" width="6" height="68" rx="3" fill="#9a5b00"/><text x="775.0" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0">Vector 4</tspan></text><text x="775.0" y="314" font-family="Arial, Helvetica, sans-serif" font-size="11" class="ink" text-anchor="middle" font-weight="400"><tspan x="775.0" dy="0">Counter Rollover / Wrapping</tspan></text><text x="775.0" y="330" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="775.0" dy="0">keystream collision</tspan></text><line x1="170.0" y1="214" x2="127.5" y2="272" class="arw" stroke-width="2" marker-end="url(#arw)"/><path d="M 730.0 214 C 730.0 239, 177.5 249, 147.5 272" fill="none" class="arw" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><line x1="450.0" y1="214" x2="342.5" y2="272" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="214" x2="560.0" y2="272" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="214" x2="775.0" y2="272" class="arw" stroke-width="2" marker-end="url(#arw)"/><text x="450.0" y="366" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="500"><tspan x="450.0" dy="0">Solid arrow = primary root cause   ·   Dashed arrow = contributing root cause</tspan></text><text x="450.0" y="386" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational analysis of CTR mode failure modes; demonstrations run in the browser against self-contained simulations.</tspan></text></svg>
