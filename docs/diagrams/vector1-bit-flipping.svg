<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>:root{--card:#ffffff;--panel:#f8fafc;--border:#e2e8f0;--ink:#0f172a;--muted:#475569;--neuf:#f1f5f9;--neus:#cbd5e1;--arw:#94a3b8}@media (prefers-color-scheme:dark){:root{--card:#0d1117;--panel:#161b22;--border:#30363d;--ink:#e6edf3;--muted:#9aa4b2;--neuf:#1c2330;--neus:#3d444d;--arw:#6e7681}}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.fneu{fill:var(--neuf)}.sneu{stroke:var(--neus)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="418" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Vector 1 — Precision Bit-Flipping Mechanics</tspan></text><text x="450.0" y="52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">because CTR uses bitwise XOR with zero diffusion, flipping C[i] directly flips P[i]</tspan></text><rect class="panel" x="30" y="70" width="840" height="310" rx="10" stroke-width="1.5"/><text x="50" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" class="ink" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Step 1: Ciphertext is generated under server key K and initial counter T</tspan></text><rect fill="#fef3c7" stroke="#b45309" x="50" y="110" width="240" height="36" rx="9" stroke-width="1.5"/><text x="170.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#92400e" text-anchor="middle" font-weight="600"><tspan x="170.0" dy="0">P = "email=alice&amp;role=user"</tspan></text><text x="310" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" class="muted" text-anchor="middle" font-weight="700"><tspan x="310" dy="0">⊕</tspan></text><rect fill="#ede9fe" stroke="#6d28d9" x="330" y="110" width="220" height="36" rx="9" stroke-width="1.5"/><text x="440.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5b21b6" text-anchor="middle" font-weight="600"><tspan x="440.0" dy="0">S = E_K(Nonce ‖ counter)</tspan></text><text x="570" y="132" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" class="muted" text-anchor="middle" font-weight="700"><tspan x="570" dy="0">=</tspan></text><rect class="fneu sneu" x="590" y="110" width="250" height="36" rx="9" stroke-width="1.5"/><text x="715.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="715.0" dy="0">C = [ 4a 1b 89 ... 7c 32 ]</tspan></text><text x="50" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" class="ink" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Step 2: Attacker flips target bits in ciphertext (Δ = "user" ⊕ "root")</tspan></text><rect fill="#fee2e2" stroke="#dc2626" x="50" y="194" width="230" height="36" rx="9" stroke-width="1.5"/><text x="165.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="600"><tspan x="165.0" dy="0">C_tampered = C ⊕ Δ</tspan></text><line x1="290" y1="212" x2="405" y2="212" stroke="#dc2626" stroke-width="2" marker-end="url(#arw)"/><rect class="card" x="282.64" y="195" width="114.72000000000001" height="17" rx="4" opacity="0.95"/><text x="340" y="207" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="500"><tspan x="340" dy="0">zero error spread</tspan></text><rect fill="#fee2e2" stroke="#dc2626" x="415" y="194" width="425" height="36" rx="9" stroke-width="1.5"/><text x="627.5" y="215.83333333333334" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="600"><tspan x="627.5" dy="0">Only the 4 target bytes are modified; surrounding bytes remain valid</tspan></text><text x="50" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" class="ink" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Step 3: Server decrypts tampered ciphertext without verifying MAC</tspan></text><rect class="fneu sneu" x="50" y="278" width="250" height="36" rx="9" stroke-width="1.5"/><text x="175.0" y="300.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" class="ink" text-anchor="middle" font-weight="600"><tspan x="175.0" dy="0">P' = C_tampered ⊕ S</tspan></text><text x="320" y="300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" class="muted" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">=</tspan></text><rect fill="#fee2e2" stroke="#dc2626" x="350" y="278" width="490" height="36" rx="9" stroke-width="1.5"/><text x="595.0" y="300.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0">P' = "email=alice&amp;role=root"   (Privilege Escalation Verified!)</tspan></text><text x="450.0" y="405" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: ProfileService in attacks.mjs is a local in-memory simulation for defensive education.</tspan></text></svg>
