<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436" font-family="Arial, Helvetica, sans-serif"><style>:root{--card:#ffffff;--panel:#f0f8fb;--border:#d3e4eb;--ink:#142f40;--muted:#486371;--neuf:#f0f8fb;--neus:#b9d3de;--arw:#7f9aa6}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.fneu{fill:var(--neuf)}.sneu{stroke:var(--neus)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="434" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Vector 2 — Two-Time Pad Keystream Reuse</tspan></text><text x="450.0" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">reusing a nonce destroys confidentiality by collapsing ciphertexts into plaintext XOR</tspan></text><rect class="panel" x="30" y="70" width="840" height="330" rx="10" stroke-width="1.5"/><text x="50" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12.5" class="ink" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Encrypting two distinct plaintexts with the same (Key, Nonce)</tspan></text><rect class="fneu" stroke="#006da0" x="50" y="110" width="360" height="34" rx="9" stroke-width="1.5"/><text x="230.0" y="130.83333333333334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="230.0" dy="0">C₁ = P₁ ⊕ S   ("TRANSFER $00500...")</tspan></text><rect class="fneu" stroke="#006da0" x="450" y="110" width="390" height="34" rx="9" stroke-width="1.5"/><text x="645.0" y="130.83333333333334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" class="ink" text-anchor="middle" font-weight="600"><tspan x="645.0" dy="0">C₂ = P₂ ⊕ S   ("MEETING AT MIDNIGHT...")</tspan></text><text x="50" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12.5" class="ink" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Keystream Cancellation: XORing both ciphertexts removes S entirely</tspan></text><rect fill="#fef3c7" stroke="#9a5b00" x="50" y="190" width="790" height="36" rx="9" stroke-width="1.5"/><text x="445.0" y="212.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0">C₁ ⊕ C₂ = (P₁ ⊕ S) ⊕ (P₂ ⊕ S) = P₁ ⊕ P₂   (Keystream S completely cancels out!)</tspan></text><text x="50" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12.5" class="ink" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Plaintext Recovery Options (No AES key required)</tspan></text><rect fill="#ede9fe" stroke="#6d28d9" x="50" y="270" width="380" height="56" rx="9" stroke-width="1.5"/><text x="240.0" y="287.8333333333333" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b21b6" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">Known Plaintext:</tspan><tspan x="240.0" dy="14">P₂ = (C₁ ⊕ C₂) ⊕ P₁</tspan><tspan x="240.0" dy="14">Instant recovery of full P₂ if P₁ is known</tspan></text><rect fill="#ede9fe" stroke="#6d28d9" x="460" y="270" width="380" height="56" rx="9" stroke-width="1.5"/><text x="650.0" y="287.8333333333333" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b21b6" text-anchor="middle" font-weight="600"><tspan x="650.0" dy="0">Statistical Crib Dragging:</tspan><tspan x="650.0" dy="14">Drag natural language words ('the', 'http')</tspan><tspan x="650.0" dy="14">Readable text appears at matching offsets</tspan></text><text x="450.0" y="422" font-family="Arial, Helvetica, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational browser demonstration of the two-time pad failure using synthetic messages.</tspan></text></svg>
