schema_version: 1

# Durable content decisions for this repository.
#
# Register restarted at CD-0001 on 2026-08-24 by deliberate choice. Thirteen earlier
# decisions (the previous CD-0001..CD-0013) were deleted from the working tree and are
# recoverable only from git history:
#
#   git show a816173:reviews/CONTENT_DECISIONS.yml
#
# They were not carried forward. A reviewer who reaches a conclusion that contradicts one
# of them will not be warned by this file — see the limitations section of LATEST_REVIEW.md.

decisions:
  - id: "CD-0001"
    title: "A figure may not equate a ciphertext expression to a plaintext expression"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/diagrams/generate_diagrams.py"
        - "docs/diagrams/modes-ctr-etm-gcm.svg"
        - "docs/diagrams/taxonomy.svg"
        - "test/figures.test.mjs"
      concepts:
        - "malleability notation"
        - "figure mathematical correctness"
        - "ciphertext and plaintext space"
    originating_feedback: "modes-ctr-etm-gcm.svg asserted \"Malleable: C[i] ⊕ Δ = P[i] ⊕ Δ\". The two sides are values in different spaces — they differ by the keystream — so the equality is false as written, even though the surrounding prose stated the relation correctly."
    decision: "Notation inside a figure is held to the same correctness standard as prose. An equality whose left side reduces to ciphertext space and whose right side reduces to plaintext space is rejected; crossing between the two requires naming the keystream, or expressing the relation as one that holds under decryption."
    rationale: "The relation is P' = (C ⊕ Δ) ⊕ S = P ⊕ Δ — decryption is what carries the delta across. An even number of same-space terms is a difference rather than a value in that space, which is why C₁ ⊕ C₂ = P₁ ⊕ P₂ is sound and C[i] ⊕ Δ = P[i] ⊕ Δ is not. A figure detaches from its caption when pasted elsewhere, so it cannot rely on adjacent prose to correct it."
    authoritative_sources:
      - title: "NIST SP 800-38A Appendix D"
        url: "https://csrc.nist.gov/pubs/sp/800/38/a/final"
        supports: "\"for the OFB and CTR modes, the decryption of any ciphertext block is vulnerable to the introduction of specific bit errors into that ciphertext block if its integrity is not protected\" — the effect is stated on decryption, not as an identity between ciphertext and plaintext."
    verification_methods:
      - "test/figures.test.mjs parses every equation out of the generated SVGs and rejects cross-space equalities; the guard was verified by reintroducing the original string and confirming it fails."
      - "Rendered inspection of modes-ctr-etm-gcm.svg in light and dark themes after the fix."
    approved_outcome: "The figure reads \"Malleable: C[i] ⊕ Δ decrypts to P[i] ⊕ Δ — no error spread\", matching the phrasing taxonomy.svg already used, and test/figures.test.mjs enforces the rule across all figures."
    invalidation_conditions:
      - "A figure adopts an explicit decryption-function notation (for example D(·)) that makes an equality between the two sides well-formed."
      - "The guard is shown to reject a sound equation, indicating the space analysis is wrong rather than the figure."
    related_decisions: ["CD-0007"]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: "CD-0002"
    title: "Quotation marks are reserved for strings verbatim in the cited artifact"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
      concepts:
        - "citation integrity"
        - "Encrypt-then-MAC key independence"
        - "Bellare and Namprempre"
    originating_feedback: "The Option B guidance quoted Bellare and Namprempre as requiring that the encryption and MAC keys \"are independently chosen\". That string does not appear in ePrint 2000/025; the paper's only use of \"independently\" concerns choosing the two schemes independently."
    decision: "A quoted string must be present verbatim in the artifact cited. Where the underlying claim is correct but the wording is the author's, state it as a description of the source rather than as a quotation."
    rationale: "Key independence is genuine but structural: the paper proves the composition over a scheme whose key is Ke‖Km, each generated by its own scheme's key generation. Presenting an author's paraphrase in quotation marks is unverifiable at the source and undermines the surrounding citations, all of which do check out verbatim."
    authoritative_sources:
      - title: "Bellare & Namprempre, IACR ePrint 2000/025"
        url: "https://eprint.iacr.org/2000/025"
        supports: "The composed decryption algorithm is written D(Ke‖Km, C); the paper states \"EtM is secure from all points of view, making it a good choice for a standard\" and does not contain the phrase \"are independently chosen\"."
    verification_methods:
      - "Full text of ePrint 2000/025 extracted and searched case-insensitively for \"independent\" and \"independently\": one occurrence, referring to choosing the schemes."
    approved_outcome: "The page states that the result is proved over a composed scheme keyed by K_enc ‖ K_mac, each produced by its own scheme's key generation, so the guarantee says nothing about a single key reused for both operations."
    invalidation_conditions:
      - "A revised or journal version of the paper at the cited URL contains the quoted wording."
      - "A different primary source is substituted that does state key independence in those words."
    related_decisions: []
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: "CD-0003"
    title: "TLS 1.3 removed unauthenticated modes, not counter mode, and the page says so explicitly"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
        - "README.md"
      concepts:
        - "TLS 1.3 cipher suites"
        - "AEAD migration"
        - "counter mode deprecation"
        - "industry direction"
    originating_feedback: "\"Industry is moving to deprecate CTR support in TLS 1.3\" is a common reading and was raised directly. It inverts what happened, and the page had no section addressing it."
    decision: "The page carries a \"Where the standards are heading\" section stating that TLS 1.3 removed confidentiality-only record protection while every one of its five cipher suites remains a counter-driven keystream with a tag attached, and that no raw AES-CTR suite ever existed in TLS to remove."
    rationale: "AES-GCM and AES-CCM are both counter mode plus a MAC, and ChaCha20-Poly1305 is the same construction from a different primitive. Of 356 registered TLS cipher suites, the only two naming CTR are GOST suites from RFC 9189, both marked not recommended and both pairing CTR with an OMAC tag. Unauthenticated CTR is something applications build for themselves, which is why it recurs in application code rather than protocol libraries. Left unaddressed, the misreading undercuts the page's thesis with readers who arrive already believing it."
    authoritative_sources:
      - title: "RFC 8446 §B.4 and introduction"
        url: "https://www.rfc-editor.org/rfc/rfc8446"
        supports: "The five TLS 1.3 cipher suites, and \"The list of supported symmetric encryption algorithms has been pruned of all algorithms that are considered legacy. Those that remain are all Authenticated Encryption with Associated Data (AEAD) algorithms.\""
      - title: "NIST SP 800-38C"
        url: "https://csrc.nist.gov/pubs/sp/800/38/c/final"
        supports: "CCM = \"Counter with Cipher Block Chaining-Message Authentication Code\", \"combining the techniques of the Counter (CTR) mode and the Cipher Block Chaining-Message Authentication Code (CBC-MAC) algorithm\"."
      - title: "RFC 8439 §2.4"
        url: "https://www.rfc-editor.org/rfc/rfc8439"
        supports: "ChaCha20 \"successively calls the ChaCha20 block function … with successively increasing block counter parameters\", concatenates keystream blocks and XORs with the plaintext."
      - title: "NIST IR 8459 §4"
        url: "https://csrc.nist.gov/pubs/ir/8459/final"
        supports: "\"Starting with TLS 1.3, a decision was made to deprecate all modes of operation that only provided confidentiality protection.\""
      - title: "RFC 9189"
        url: "https://www.rfc-editor.org/rfc/rfc9189"
        supports: "The only two CTR-named entries in the IANA TLS cipher suite registry, both GOST profiles of TLS 1.2 pairing CTR with OMAC."
    verification_methods:
      - "IANA TLS cipher suite registry (tls-parameters-4.csv) counted: 356 registered TLS_ suite names, 2 containing _CTR_, both RFC 9189 GOST suites marked N,N."
      - "RFC 8446 full text searched for CTR: the only occurrence is the SP 800-38D reference title."
    approved_outcome: "docs/index.html carries the section with a three-row suite table; README.md carries a short paragraph correcting the misreading and linking to it."
    invalidation_conditions:
      - "A future TLS version registers a confidentiality-only or raw-CTR cipher suite."
      - "An AEAD suite not built on a counter-driven keystream is added to TLS and becomes a recommended option."
    related_decisions: ["CD-0004"]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: "CD-0004"
    title: "CTR's approved status is sourced to IR 8459's explicit recommendation, not to NIST's silence"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
        - "README.md"
      concepts:
        - "CTR deprecation status"
        - "claim strength"
        - "argument from silence"
    originating_feedback: "The page established \"CTR is not deprecated\" from the absence of a prohibition in SP 800-38A, contrasted with ECB's explicit \"should not be used\". The lede went further, to \"not deprecated and not discouraged\"."
    decision: "State the approval from NIST's own review conclusion rather than from silence, and drop \"not discouraged\". Disclose that the status is conditional and forward-looking, with the condition NIST itself named."
    rationale: "IR 8459 recommends \"not yet deprecating\" these modes specifically because a more secure NIST-recommended alternative does not exist yet — retention with a stated reason, not endorsement. \"Not discouraged\" overstates that, particularly alongside NIST's decision to revise SP 800-38A to add guidance on incorporating authentication. Argument from silence is also the weaker form of the same claim and goes stale the moment NIST publishes anything."
    authoritative_sources:
      - title: "NIST IR 8459 §12"
        url: "https://csrc.nist.gov/pubs/ir/8459/final"
        supports: "\"Consider disallowing ECB for encrypting secrets\" and \"Consider not yet deprecating the other NIST SP 800-38A modes, as they are widely used in certain applications where a more secure NIST-recommended alternative is not yet available.\""
      - title: "NIST, Decision to Revise SP 800-38A (April 2023)"
        url: "https://csrc.nist.gov/news/2023/decision-to-revise-nist-sp-800-38a"
        supports: "Revision goals including \"guidance on the importance of incorporating authentication, where feasible\", and \"If a suitable additional technique is eventually approved in a new publication, NIST will consider deprecating the modes in SP 800-38A.\""
    verification_methods:
      - "SP 800-38A CSRC page checked on 2026-08-24: status Final, carrying the 04/28/2023 planning note."
      - "IR 8459 confirmed Final, September 2024, authors Mouha and Dworkin."
    approved_outcome: "The lede reads \"not deprecated — NIST's 2024 review of the mode series recommended keeping it\"; the approved-mode bullet cites IR 8459 and links forward to the standards-direction section; README carries the matching wording."
    invalidation_conditions:
      - "NIST publishes a revised SP 800-38A, or approves a cryptographic accordion in the SP 800-197 series, either of which may change the deprecation posture."
      - "IR 8459 is superseded by a later review report reaching a different recommendation."
    related_decisions: ["CD-0003"]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: "CD-0005"
    title: "The three root causes are scoped to the mode; implementation-level attacks are named as a separate class"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
        - "docs/diagrams/taxonomy.svg"
      concepts:
        - "CTR mode failure taxonomy"
        - "side-channel attacks"
        - "claim scope"
    originating_feedback: "The taxonomy was introduced with \"All CTR mode vulnerabilities trace back to three fundamental root causes\" — a universal over a category the page does not exhaustively enumerate."
    decision: "Scope the taxonomy to weaknesses in the mode itself, and name implementation-level side-channel and fault attacks as a class that is deliberately out of scope, with a pointer to where they are surveyed."
    rationale: "Timing, cache and fault attacks are real CTR deployment failures that derive from none of malleability, keystream determinism or missing authentication — they target the implementation. IR 8459 §10 treats them separately. Keeping the universal would have made the page's own taxonomy falsifiable by an example the page never discusses."
    authoritative_sources:
      - title: "NIST IR 8459 §10"
        url: "https://csrc.nist.gov/pubs/ir/8459/final"
        supports: "Implementation considerations, including side-channel and fault-injection attacks on modes of operation, treated separately from the modes' own security properties."
    verification_methods:
      - "Prose sweep for absolute quantifiers across docs/index.html; this was the only universal not supported by the page's own scope."
    approved_outcome: "The section opens \"Every weakness on this page traces back to three root causes in the mode itself\", explicitly excludes implementation-level attacks, and cites IR 8459 §10 for them."
    invalidation_conditions:
      - "The page expands scope to cover implementation-level attacks, in which case the taxonomy must either absorb them or state a new boundary."
      - "A mode-level CTR failure is identified that derives from none of the three root causes."
    related_decisions: []
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: "CD-0006"
    title: "A demonstration that isolates one variable holds every other one constant in code, not in wording"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/js/attacks.mjs"
        - "docs/index.html"
      concepts:
        - "demonstration sufficiency"
        - "three-way tamper comparison"
        - "key size"
    originating_feedback: "compareTamperDetection claimed \"the only variable is what authenticates the ciphertext\" while encrypting under AES-128 for raw CTR and Encrypt-then-MAC but AES-256 for GCM."
    decision: "When a demonstration asserts that one variable is isolated, change the code so the assertion is literally true rather than weakening the assertion. All three schemes encrypt under a 256-bit key via a single named constant."
    rationale: "Key size cannot affect this outcome — malleability is a property of the mode — so the demonstration was not misleading in its result. It was nonetheless not doing what it said, and a reader copying the pattern learns the wrong standard for controlled comparison. Fixing the code costs one constant; softening the claim costs the reader the guarantee."
    authoritative_sources: []
    verification_methods:
      - "test/attacks.test.mjs asserts the identical delta 071c0a06 at the same role offset across all three schemes, with detection branching on the authenticated property rather than the scheme name."
      - "Driven live in-browser after the change: CTR accepts the forgery, Encrypt-then-MAC and GCM both reject before returning plaintext."
    approved_outcome: "COMPARISON_KEY_BYTES = 32 is used for the CTR, Encrypt-then-MAC and GCM encryption keys; the comment records why the constant exists."
    invalidation_conditions:
      - "The comparison is extended to a property where key size is the variable under study."
      - "A scheme is added whose key size cannot be set to 256 bits."
    related_decisions: []
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: "CD-0007"
    title: "Every figure carries its own educational and defensive scope line, enforced by test"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/diagrams/generate_diagrams.py"
        - "docs/diagrams/vector2-two-time-pad.svg"
        - "test/figures.test.mjs"
      concepts:
        - "dual-use defensibility"
        - "detached artifact"
        - "figure scope line"
    originating_feedback: "Five of six figures carried an educational or defensive framing in their scope line; vector2-two-time-pad.svg named only the source files that implement the demonstration."
    decision: "Each figure states its own scope internally, naming educational or defensive use, and a test enforces it rather than relying on review to notice."
    rationale: "A figure demonstrating a weakness detaches from the page the moment it is pasted into a chat, deck or document. Framing that lives only in surrounding prose does not travel with it, so it must be inside the artifact. Five out of six is exactly the state that survives review by looking consistent at a glance."
    authoritative_sources: []
    verification_methods:
      - "test/figures.test.mjs checks every generated SVG for a Scope: text node naming educational or defensive use."
      - "Rendered inspection of all six figures in light and dark themes."
    approved_outcome: "vector2-two-time-pad.svg reads \"Scope: educational demonstration of the two-time pad break; runs locally in attacks.mjs and test/attacks.test.mjs.\"; all six figures pass the enforcing test."
    invalidation_conditions:
      - "A figure is added that depicts no weakness and no attack, where the framing may be unnecessary."
    related_decisions: ["CD-0001"]
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"

  - id: "CD-0008"
    title: "The page covers migrating an already-deployed unauthenticated format"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
      concepts:
        - "migration"
        - "format versioning"
        - "retrofitting authentication"
    originating_feedback: "Completeness review found interoperability and migration to be the one thin category: the page told a reader to add authentication but not how to get there from ciphertext already at rest or on the wire."
    decision: "Add a short migration subsection after the two options, covering what a retrofitted tag does and does not prove, binding the format version inside the authenticated region, the dual-read window, and deriving rather than promoting the MAC key."
    rationale: "A reader convinced by the page is then blocked on the operational question, and the traps are specific enough to get wrong: a MAC computed over legacy ciphertext authenticates it only from that moment, an unbound version field enables downgrade to the untagged reader, and an indefinite dual-read window leaves the system at the weaker format's security. Keeping it to four points holds the page to failure analysis rather than turning it into a migration runbook."
    authoritative_sources:
      - title: "NIST SP 800-108 Rev. 1"
        url: "https://csrc.nist.gov/pubs/sp/800/108/r1/upd1/final"
        supports: "Deriving independent encryption and MAC keys from one master secret rather than reusing an existing key across both operations."
    verification_methods:
      - "Reviewed against the page's existing Option B rules so the migration guidance restates no rule and contradicts none."
    approved_outcome: "docs/index.html carries \"Migrating a format that is already deployed\" as a four-point ordered list between Option B and the three-way demonstration."
    invalidation_conditions:
      - "The page's scope narrows to exclude operational guidance."
      - "The subsection grows past the point where it competes with the failure analysis for the reader's attention."
    related_decisions: []
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-24"
    last_reviewed_on: "2026-08-24"
