schema_version: 1
decisions:
  - id: "CD-0001"
    title: "Structure CTR mode vulnerabilities into three root causes and four attack vectors"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
        - "docs/diagrams/taxonomy.svg"
        - "docs/diagrams/generate_diagrams.py"
      concepts:
        - "CTR mode failure taxonomy"
        - "stream cipher malleability"
        - "keystream reuse"
    originating_feedback: "Ensure the explanation of CTR mode failure is formally grounded in cryptographic definitions rather than an arbitrary list of weaknesses."
    decision: "Group all weaknesses under three root causes: stream-cipher malleability (bit-flipping), keystream determinism / nonce reuse, and missing authentication."
    rationale: "CTR mode transforms a block cipher into a stream cipher via C = P XOR S. Bitwise XOR has zero error spread (malleability), fixed nonces yield identical keystreams (determinism), and the absence of a MAC allows silent modification."
    authoritative_sources:
      - title: "NIST SP 800-38A §6.5"
        url: "https://csrc.nist.gov/pubs/sp/800/38/a/final"
        supports: "Definition of CTR mode and unique counter requirement across all invocations under a key."
      - title: "Cryptopals Crypto Challenges"
        url: "https://cryptopals.com/"
        supports: "Practical demonstrations of CTR bit-flipping (Set 4 Challenge 26) and random-access edit keystream extraction (Set 4 Challenge 25)."
    verification_methods:
      - "test/attacks.test.mjs unit tests verifying all four attack vectors against real AES."
    approved_outcome: "docs/index.html and docs/diagrams/taxonomy.svg depict the three root causes feeding the four attack vectors."
    invalidation_conditions:
      - "NIST updates SP 800-38A to alter CTR mode specification."
      - "A new foundational class of CTR failure is identified that does not derive from malleability, keystream determinism, or missing authentication."
    related_decisions: []
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-22"
    last_reviewed_on: "2026-08-22"

  - id: "CD-0002"
    title: "Prescribe AEAD and Encrypt-then-MAC as the only approved cryptographic mitigations"
    status: "superseded"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
        - "docs/js/crypto.mjs"
        - "docs/js/attacks.mjs"
      concepts:
        - "AEAD"
        - "Encrypt-then-MAC"
        - "AES-GCM"
    originating_feedback: "Provide unambiguous defensive guidance so developers do not attempt insecure custom patching of CTR mode."
    decision: "Mandate AEAD (AES-GCM, ChaCha20-Poly1305) as primary defense, and Encrypt-then-MAC (AES-CTR + HMAC-SHA256 verified in constant-time before decrypt) as secondary defense."
    rationale: "Only cryptographic authentication tags computed over ciphertext can detect bit-flipping and stream splicing before decryption occurs."
    authoritative_sources:
      - title: "NIST SP 800-38D"
        url: "https://csrc.nist.gov/pubs/sp/800/38/d/final"
        supports: "Galois/Counter Mode (GCM) AEAD specification."
      - title: "RFC 8439"
        url: "https://www.rfc-editor.org/rfc/rfc8439"
        supports: "ChaCha20-Poly1305 AEAD standard."
    verification_methods:
      - "Automated tests in test/attacks.test.mjs demonstrating 1-bit tamper rejection for both GCM and Encrypt-then-MAC."
    approved_outcome: "Defensive sections in docs/index.html demonstrate tamper rejection and provide clear implementation guidelines."
    invalidation_conditions:
      - "Standard bodies deprecate AES-GCM or Encrypt-then-MAC due to newly discovered primitive weaknesses."
    related_decisions:
      - "CD-0008"
    supersedes: []
    superseded_by: "CD-0008"
    originated_on: "2026-08-22"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0003"
    title: "Explicitly document GCM residual risks and NIST invocation limits"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
      concepts:
        - "GCM nonce reuse"
        - "NIST SP 800-38D invocation ceiling"
    originating_feedback: "Ensure migration advice does not overclaim safety by omitting GCM's severe nonce-reuse vulnerability."
    decision: "Include a dedicated section documenting GCM nonce uniqueness and the 2^32 invocation limit under NIST SP 800-38D §8.3."
    rationale: "GCM nonce reuse exposes the GHASH key and completely breaks integrity. Recommending GCM without highlighting nonce governance creates residual vulnerabilities."
    authoritative_sources:
      - title: "NIST SP 800-38D §8"
        url: "https://csrc.nist.gov/pubs/sp/800/38/d/final"
        supports: "Uniqueness requirements and 2^32 random nonce invocation limit."
    verification_methods:
      - "Direct verification against NIST SP 800-38D §8.3 text."
    approved_outcome: "docs/index.html covers GCM nonce uniqueness and the 2^32 invocation ceiling under the heading 'Operating limits: nonces, counters, tags, and rekeying', in the subsection 'Nonce uniqueness'. The section was originally titled 'Residual risk after switching to GCM'; it was renamed and widened to cover tag length and counter exhaustion alongside nonce reuse. The decision is about the coverage, which is intact, not the heading text."
    invalidation_conditions:
      - "NIST updates SP 800-38D invocation ceiling guidelines."
    related_decisions: []
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-22"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0004"
    title: "Cite real-world cases from primary research; attach a CVE only where one exists and matches"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
      concepts:
        - "real-world evidence table"
        - "CVE attribution"
        - "citation verification"
    originating_feedback: "A 2026-08-23 fresh review found that three of the four CVE identifiers in the Real-world evidence table resolved to unrelated vulnerabilities, and that the MEGA citation carried a fabricated author list and a hostname that does not resolve."
    decision: "Every case in the Real-world evidence table cites the primary research that established it. A CVE identifier is included only when that CVE has been checked against NVD and actually describes the case. Where no CVE was assigned, the table says so explicitly rather than supplying a plausible-looking identifier."
    rationale: "CVE-2022-37450 is a Go Ethereum uncle-block flaw, CVE-2005-0416 is a Windows animated-cursor buffer overflow, and CVE-2019-14888 is an Undertow HTTPS denial of service. None relates to the case it was attached to. A table whose purpose is verifiable provenance is worse than no table when its identifiers are wrong, and every one of those errors passed the repository's automated checks."
    authoritative_sources:
      - title: "NVD — CVE-2017-13077"
        url: "https://nvd.nist.gov/vuln/detail/CVE-2017-13077"
        supports: "The only CVE retained: WPA and WPA2 allow reinstallation of the Pairwise Transient Key Temporal Key during the four-way handshake."
      - title: "MEGA: Malleable Encryption Goes Awry (IACR ePrint 2022/959)"
        url: "https://eprint.iacr.org/2022/959"
        supports: "Correct authorship — Matilda Backendal, Miro Haller, Kenneth G. Paterson — replacing the fabricated attribution."
      - title: "The Misuse of RC4 in Microsoft Word and Excel (IACR ePrint 2005/007)"
        url: "https://eprint.iacr.org/2005/007"
        supports: "Hongjun Wu's RC4 keystream-reuse result, replacing a 404 URL that claimed an FSE 2005 proceedings location."
      - title: "Redirect attack on Shadowsocks stream ciphers"
        url: "https://github.com/shadowsocks/shadowsocks-org/issues/154"
        supports: "February 2020 disclosure by Zhiniang Peng; no CVE was assigned."
    verification_methods:
      - "Each CVE identifier fetched from NVD and compared against the case it is attached to."
      - "Every outbound href in docs/index.html requested over HTTPS; all 16 return 200."
    approved_outcome: "The table carries one verified CVE (KRACK) and marks the other three cases 'no CVE assigned', each linked to its primary source."
    invalidation_conditions:
      - "A CVE is later assigned to the MEGA, Microsoft Office RC4, or Shadowsocks stream-cipher cases and is confirmed against NVD."
    related_decisions:
      - "CD-0005"
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-23"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0005"
    title: "Keep MEGA as a boundary case under root cause 3, not as Vector 1 evidence"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
      concepts:
        - "MEGA 2022"
        - "attack vector mapping"
        - "attacker state and threat model"
    originating_feedback: "The same review found the MEGA row described 'AES-128-CTR with unauthenticated file chunks' and mapped it to Vector 1 (precision bit-flipping), neither of which the paper supports."
    decision: "MEGA stays in the table, but mapped to root cause 3 applied to key material rather than to Vector 1, and states plainly that the threat model is a malicious service provider. The row's teaching point is that authenticating the message does not help when the key material is malleable."
    rationale: "Figures 2 and 3 of the paper show file chunks encrypted with a custom AES-CCM* — a CBC-MAC tag plus AES-CTR — so the chunks were authenticated. The malleability actually exploited is AES-ECB over the node keys wrapped under the master key. Mapping it to CTR bit-flipping misattributes the mechanism; deleting the row would lose a genuinely instructive boundary case."
    authoritative_sources:
      - title: "MEGA: Malleable Encryption Goes Awry (IACR ePrint 2022/959)"
        url: "https://eprint.iacr.org/2022/959"
        supports: "Fig. 2 chunkwise file encryption via AES-CCM*; Fig. 3 CBC-MAC tag plus AES-CTR; AES-ECB wrapping of node keys under the master key; malicious-server threat model."
    verification_methods:
      - "Paper PDF text extracted and the cipher-mode figures read directly rather than relying on secondary summaries."
    approved_outcome: "The MEGA row states the AES-CCM* chunk authentication, names AES-ECB key wrapping as the malleable component, identifies the malicious-server threat model, and maps to root cause 3 rather than Vector 1."
    invalidation_conditions:
      - "A subsequent result demonstrates a CTR-malleability attack against MEGA's file chunks themselves."
    related_decisions:
      - "CD-0001"
      - "CD-0004"
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-23"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0006"
    title: "Describe GCM's tag and CBC's error propagation in the primary standard's own terms"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
        - "docs/js/ui.mjs"
        - "docs/js/attacks.mjs"
        - "docs/diagrams/generate_diagrams.py"
        - "docs/diagrams/modes-ctr-etm-gcm.svg"
      concepts:
        - "GMAC versus GHASH"
        - "CBC error propagation"
    originating_feedback: "The review flagged GCM's authentication tag being called a 'GMAC tag' in four places, and the comparison diagram describing CBC as having 'cascading error propagation'."
    decision: "GCM's tag is described as GHASH-based, with GMAC named only as SP 800-38D's authentication-only variant. CBC's tampering behaviour is described as bounded to two blocks, not cascading."
    rationale: "SP 800-38D states that GMAC 'is simply an authentication mode on the input data', so it names the authentication-only construction rather than GCM's tag. SP 800-38A Appendix D states that in CBC 'any bit positions that contain bit errors in a ciphertext block will also contain bit errors in the decryption of the succeeding ciphertext block; the other bit positions are not affected' — a bounded two-block effect. Cascading applies to CBC encryption, not to the decryption-side tampering the comparison is about."
    authoritative_sources:
      - title: "NIST SP 800-38D"
        url: "https://csrc.nist.gov/pubs/sp/800/38/d/final"
        supports: "GMAC defined as an authentication-only mode; GCM's tag produced via GHASH."
      - title: "NIST SP 800-38A Appendix D"
        url: "https://csrc.nist.gov/pubs/sp/800/38/a/final"
        supports: "CBC decryption-side bit errors are confined to the affected block and the same bit positions of the succeeding block."
    verification_methods:
      - "Both standards' PDFs parsed and the defining sentences quoted directly from Section 8 / Appendix D."
    approved_outcome: "No occurrence of 'GMAC' remains as a name for GCM's tag, and the comparison diagram states the two-block bound with its source named in the diagram's scope line."
    invalidation_conditions:
      - "NIST revises SP 800-38A or SP 800-38D such that these definitions change."
    related_decisions:
      - "CD-0002"
      - "CD-0003"
      - "CD-0009"
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-23"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0007"
    title: "Never render a successful attack outcome in the palette's safe colour"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/diagrams/generate_diagrams.py"
        - "docs/diagrams/vector1-bit-flipping.svg"
      concepts:
        - "diagram semantic colour"
        - "figure self-sufficiency"
    originating_feedback: "The review found the Vector 1 diagram rendering its 'Privilege Escalation Verified!' outcome box in green, the colour the generator's own docstring reserves for 'safe'."
    decision: "Compromise outcomes are rendered in the danger colour. Green is reserved for a defence holding. This applies to every figure, not only the one that was wrong."
    rationale: "A reader scans a figure by colour before reading it, and figures travel detached from the page. Painting the one panel that shows the attack succeeding in the safe colour inverts the meaning for exactly the reader who cannot rely on the surrounding prose. styles.css already uses red for compromise throughout, so the diagram contradicted the site it belongs to."
    authoritative_sources: []
    verification_methods:
      - "Each SVG loaded standalone at its own URL and read as a detached artifact, rather than only being checked for agreement with the prose."
    approved_outcome: "vector1-bit-flipping.svg renders the Step 3 privilege-escalation outcome in the danger palette, consistent with styles.css and with the generator's stated colour semantics."
    invalidation_conditions:
      - "The project's palette semantics change such that green no longer denotes a safe or passing state."
    related_decisions:
      - "CD-0001"
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-23"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0008"
    title: "Frame CTR as a confidentiality mode needing composition, not a mode to be avoided"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
        - "README.md"
        - "DISCLAIMER.md"
        - "docs/diagrams/generate_diagrams.py"
        - "docs/diagrams/modes-ctr-etm-gcm.svg"
      concepts:
        - "CTR standing under NIST"
        - "normative strength of mitigation guidance"
        - "Encrypt-then-MAC composition"
        - "runnable defensive samples"
    originating_feedback: "Reader feedback on 2026-08-23: the site read as though CTR must not be used, which is not what NIST says. Confirm the standards position, and show HMAC-based authentication and GCM as the ways to use it safely."
    decision: "Reframe the project around what CTR guarantees. State that CTR is an approved SP 800-38A confidentiality mode that NIST neither deprecates nor advises against, that its malleability is documented and explicitly conditioned on integrity not being protected, and that GCM is itself a variation of Counter mode. Present the fix as two correct compositions — an AEAD, or AES-CTR with HMAC as Encrypt-then-MAC — each with a runnable, tested sample. Supersedes CD-0002, whose 'only approved mitigations' and 'mandate' wording stated an authorial recommendation at normative strength and implied CTR must be replaced."
    rationale: "SP 800-38A's abstract lists CTR among five approved confidentiality modes and says they 'can provide cryptographic protection for sensitive, but unclassified, computer data', with no advice against CTR — in contrast to ECB, which the same document says 'should not be used' where pattern confidentiality matters. Appendix D conditions CTR malleability on integrity 'not being protected'. SP 800-38D §1 states GCM 'provides assurance of the confidentiality of data using a variation of the Counter mode of operation for encryption', so recommending GCM as a replacement for CTR misdescribes what changes. The accurate engineering rule is that CTR requires an authentication tag over the ciphertext wherever an attacker can modify it."
    authoritative_sources:
      - title: "NIST SP 800-38A"
        url: "https://csrc.nist.gov/pubs/sp/800/38/a/final"
        supports: "CTR listed among five approved confidentiality modes; ECB alone carries a 'should not be used' caveat; Appendix D conditions CTR malleability on integrity not being protected."
      - title: "NIST SP 800-38D"
        url: "https://csrc.nist.gov/pubs/sp/800/38/d/final"
        supports: "GCM confidentiality is 'a variation of the Counter mode of operation'; tag-length constraints (§5.2.1.2, App. C); replay is not inherently prevented (App. D)."
      - title: "Bellare & Namprempre, IACR ePrint 2000/025"
        url: "https://eprint.iacr.org/2000/025"
        supports: "Encrypt-then-MAC 'is secure from all points of view, making it a good choice for a standard'; encryption and MAC keys 'are independently chosen'; decrypt+verify is defined as verifying the tag before decrypting."
      - title: "FIPS 198-1"
        url: "https://csrc.nist.gov/pubs/fips/198-1/final"
        supports: "HMAC as the keyed-hash message authentication code used in the Encrypt-then-MAC sample. URL corrected 2026-08-23: this record had carried the guessed path /pubs/fips/198/1/final, which returns 404. The page itself already used the correct hyphenated form; only the register was wrong."
    verification_methods:
      - "Both published samples executed under Node against Web Crypto: round-trip, 1-bit tamper rejection, truncation rejection, and AAD-mismatch rejection all confirmed."
      - "Standards text extracted from the published PDFs and quoted rather than paraphrased from secondary sources."
    approved_outcome: "The page leads with 'AES-CTR provides confidentiality, not integrity', carries a 'What CTR guarantees — and what it does not' section citing the three standards facts, and presents Option A (AEAD) and Option B (AES-CTR + HMAC, Encrypt-then-MAC) as equally correct compositions with runnable samples. README and DISCLAIMER carry the same framing."
    invalidation_conditions:
      - "NIST deprecates CTR mode or issues guidance advising against its use."
      - "SP 800-38D is revised such that GCM no longer builds its confidentiality on Counter mode."
    related_decisions:
      - "CD-0002"
      - "CD-0003"
      - "CD-0006"
    supersedes:
      - "CD-0002"
    superseded_by: null
    originated_on: "2026-08-23"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0009"
    title: "Compare CTR only against the options the reader can actually choose"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/index.html"
        - "docs/diagrams/modes-ctr-etm-gcm.svg"
        - "docs/diagrams/generate_diagrams.py"
      concepts:
        - "mode comparison axis"
        - "AES-CBC in scope"
        - "padding oracle"
    originating_feedback: "Reader feedback on 2026-08-23: why does the comparison include CBC when the subject is CTR? Would CTR versus GCM and/or CTR plus authentication not make more sense?"
    decision: "Compare AES-CTR alone, AES-CTR + HMAC (Encrypt-then-MAC), and AES-GCM. Drop AES-CBC from the comparison. The figure is renamed modes-ctr-etm-gcm.svg to match what it depicts."
    rationale: "The page asks the reader to make exactly one decision — how to authenticate counter-mode encryption — and offers exactly two answers, an AEAD or a composed MAC. CBC is neither, so its row could not be selected and did not inform the decision. It also broke the comparison axis: CTR against CBC contrasts two unauthenticated confidentiality modes on tamper behaviour, while GCM sits on the different axis of authenticated versus not. Worse, the CBC row asserted padding-oracle risk, a threat the page raises nowhere else and never develops, leaving a dangling claim. The replacement axis carries the page's thesis directly: all three rows run the same counter-mode keystream, and only the source of the authentication tag differs — which is also why 'replace CTR with GCM' is the wrong mental model. CBC remains mentioned in passing where it is genuinely relevant: as one of SP 800-38A's five approved modes, and for the padding contrast in the mechanism section."
    authoritative_sources:
      - title: "NIST SP 800-38D"
        url: "https://csrc.nist.gov/pubs/sp/800/38/d/final"
        supports: "GCM confidentiality is a variation of Counter mode, which is what makes the three-row axis coherent."
      - title: "Bellare & Namprempre, IACR ePrint 2000/025"
        url: "https://eprint.iacr.org/2000/025"
        supports: "Encrypt-then-MAC as the composed option shown in the middle row."
    verification_methods:
      - "Confirmed by inspection that CBC had no substantive treatment outside the figure, and that padding-oracle risk appeared nowhere else in the repository."
      - "Figure regenerated and loaded standalone at its own URL as a detached artifact."
    approved_outcome: "docs/diagrams/modes-ctr-etm-gcm.svg compares AES-CTR alone, AES-CTR + HMAC, and AES-GCM, with a caption naming the shared keystream and the differing authentication source. No CBC row remains, and no padding-oracle claim remains."
    invalidation_conditions:
      - "The page's scope widens to cover choosing between confidentiality modes rather than authenticating counter mode."
      - "Padding-oracle behaviour is developed as its own topic, giving a CBC row something to attach to."
    related_decisions:
      - "CD-0006"
      - "CD-0008"
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-23"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0010"
    title: "A figure must be legible as rendered — in both themes and at mobile width"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/diagrams/generate_diagrams.py"
        - "docs/diagrams/modes-ctr-etm-gcm.svg"
        - "docs/diagrams/vector2-two-time-pad.svg"
        - "docs/diagrams/vector4-counter-reuse.svg"
        - "docs/styles.css"
        - "docs/index.html"
      concepts:
        - "theme-aware SVG"
        - "figure self-sufficiency"
        - "rendered validation"
    originating_feedback: "A 2026-08-23 fresh review found three committed SVGs emitting the theme sentinels @neuf and @neus as literal attribute values. fill=\"@neuf\" is not a valid SVG paint, so browsers discarded it and fell back to black, rendering nine content boxes as unreadable black rectangles in light theme. The same review measured every figure at 0.372 scale on a 375px viewport, putting 11px body text near 4px."
    decision: "Theme sentinels resolve to per-property CSS classes and never reach the output as literal attribute values; generation fails if one does. Figures scroll inside their own container on narrow viewports rather than scaling down to illegibility. The three affected figures were regenerated."
    rationale: "box() translated sentinels to a CSS class only when fill and stroke were both neutral, so a neutral fill combined with a semantic stroke fell through to a literal attribute — and the Vector 4 blocks bypassed box() entirely with a hand-written rect. The fault was invisible in dark theme, where a black box under light --ink text reads as deliberate, which is why a dark-only rendered check passed it and why every structural check passed it: the XML is valid, the checksum is stable, and the generator correspondence is exact. Legibility is not decoration here. The boxes lost were the three security-property boxes of the page's central comparison, the two ciphertext inputs of the two-time-pad figure, and the four counter blocks whose repetition Vector 4 exists to show. A figure whose scope line renders at 4px has also lost the qualifier that keeps it defensible when detached."
    authoritative_sources: []
    verification_methods:
      - "guard_sentinels() rejects any '@' sentinel surviving into an SVG, and _paint() raises on an unmapped sentinel rather than emitting it; both were verified to fire on the exact markup that shipped."
      - "All six SVGs loaded standalone in light and dark theme after regeneration."
      - "Measured at a 375px viewport: figures render at 680px (scale 0.756, smallest text ~8.3px, was ~4.1px), scroll within their own container, and the page itself still does not scroll horizontally. Desktop rendering is unchanged at 820px."
    approved_outcome: "No theme sentinel appears as a literal value in any committed SVG; generation fails if one ever does. All six figures are legible in both themes, and each carries a figcaption."
    invalidation_conditions:
      - "The palette mechanism changes such that sentinels are no longer used."
      - "Figures are authored at a width that no longer needs a minimum to stay legible."
    related_decisions:
      - "CD-0007"
      - "CD-0009"
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-23"
    last_reviewed_on: "2026-08-23"

  - id: "CD-0011"
    title: "A demonstration reports what it observed, never what it expected"
    status: "accepted"
    implementation_state: "implemented"
    scope:
      files:
        - "docs/js/ui.mjs"
        - "docs/js/attacks.mjs"
        - "docs/index.html"
        - "test/attacks.test.mjs"
      concepts:
        - "demonstration sufficiency"
        - "verdict derivation"
        - "attacker-supplied input"
    originating_feedback: "The same review found every verdict banner hardcoded and rendered unconditionally, and confirmed four cases in-browser where a banner asserted an outcome the run had not produced: Vector 1 declared a privilege escalation after flipping an email instead of the role, Vector 4 declared a counter collision under a run that produced none, Vector 2 declared full recovery while displaying garbage, and Vector 3 recovered a different document from the one on screen."
    decision: "Every verdict is derived from the result the demonstration actually produced. Where a target is ambiguous or a run cannot demonstrate its point, the code fails loudly rather than proceeding: flipCiphertextSubstring anchors on the field name and refuses an ambiguous target, and simulateCounterRollover refuses a run too short to wrap the counter."
    rationale: "The page's whole thesis is that unauthenticated output must be verified before it is trusted. A demonstration that announces success without checking teaches the opposite, and does so in the one place a reader is most likely to believe it. The failures were not cosmetic: Vector 1's unanchored indexOf captured the first \"user\" in the plaintext, so any account like user@example.com produced a token whose role never changed while the banner reported escalation. Anchoring on \"role=\" is safe because the token sanitiser already replaces '=' in attacker-supplied email, which is the idiom compareTamperDetection and gcmTokenRoundtrip already used."
    authoritative_sources: []
    verification_methods:
      - "Regression tests: an anchored flip against user@example.com forges the role and leaves the email intact; an ambiguous unanchored target throws; a counter run too short to wrap throws; both offered counter widths regenerate every keystream block once."
      - "All five demonstrations re-exercised in-browser against the inputs that previously produced false claims, with zero console errors."
    approved_outcome: "Vector 1 anchors on the role field; Vector 4 scales its run to the selected counter width and writes a verdict on both branches; Vector 2 recovers using the plaintext that was encrypted and flags edited inputs; Vector 3 re-encrypts when the document changes; the defensive comparison names the schemes that actually accepted and rejected the forgery."
    invalidation_conditions:
      - "A demonstration is added whose outcome genuinely cannot be checked in-page."
    related_decisions:
      - "CD-0001"
      - "CD-0009"
    supersedes: []
    superseded_by: null
    originated_on: "2026-08-23"
